      tags:
        - Watch
      summary: Resolve a server link to HLS
      description: 'Resolves a server link to a playable stream: m3u8, proxied URL, qualities, subtitles and skip data. When extraction fails, `m3u8` is null and `error` is set.'
      operationId: resolveStream
      parameters:
        - name: id
          in: query
          required: true
          description: Server linkId
          schema:
            type: string
        - name: slug
          in: query
          required: false
          description: Anime slug
          schema:
            type: string
          example: one-piece-100
        - name: sv
          in: query
          required: false
          description: Server id
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Audio track hint
          schema:
            type: string
            enum:
              - sub
              - dub
              - softsub
              - hsub
              - raw
          example: sub
        - name: refresh
          in: query
          required: false
          description: Bypass cache and force fresh scrape (1 to enable)
          schema:
            type: string
            enum:
              - '0'
              - '1'
          example: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: linkId, embedUrl, m3u8, proxyUrl, qualities[], subtitles[], skipData
        '400':
          description: Invalid or missing parameters
        '404':
          description: Not found
        '500':
          description: Internal server error
  /stream/qualities:
    get:
      tags:
        - Watch
      summary: HLS quality variants
      description: Lists the variants of an HLS master playlist, best first. `url` must be on an authorised streaming domain and never a private address.
      operationId: getStreamQualities
      parameters:
        - name: url
          in: query
          required: true
          description: Master playlist URL
          schema:
            type: string
        - name: referer
          in: query
          required: false
          description: Referer to send
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: url, totalQualities, qualities[] (label, width, height, bandwidth, url, proxyUrl)
        '400':
          description: Invalid or missing parameters
        '403':
          description: Domain not allowed / private address
        '500':
          description: Internal server error
  /stream/embeds:
    get:
      tags:
        - Watch
      summary: Third-party embed URLs
      description: Ready-to-iframe player URLs (megaplay, anixo, megavid) for an episode. Identify the anime with `slug`, `mal` or `anilist`.
      operationId: getStreamEmbeds
      parameters:
        - name: slug
          in: query
          required: false
          description: Anime slug
          schema:
            type: string
          example: one-piece-100
        - name: mal
          in: query
          required: false
          description: MAL id
          schema:
            type: string
        - name: anilist
          in: query
          required: false
          description: AniList id
          schema:
            type: string
        - name: ep
          in: query
          required: false
          description: Episode number (default 1)
          schema:
            type: integer
          example: '1'
        - name: lang
          in: query
          required: false
          description: Audio
          schema:
            type: string
            enum:
              - sub
              - dub
          example: sub
        - name: provider
          in: query
          required: false
          description: Comma-separated provider ids
          schema:
            type: string
          example: megaplay,anixo
        - name: refresh
          in: query
          required: false
          description: Bypass cache and force fresh scrape (1 to enable)
          schema:
            type: string
            enum:
              - '0'
              - '1'
          example: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: slug, episode, lang, ids, providers[], unavailable[]
        '400':
          description: Invalid or missing parameters
        '500':
          description: Internal server error
  /download:
    get:
      tags:
        - Watch
      summary: Episode download links
      description: Download links for one episode grouped by server and audio type, exactly as published by the site.
      operationId: getDownloads
      parameters:
        - name: slug
          in: query
          required: true
          description: Anime slug
          schema:
            type: string
          example: one-piece-100
        - name: ep
          in: query
          required: true
          description: Episode number
          schema:
            type: string
          example: '1'
        - name: refresh
          in: query
          required: false
          description: Bypass cache and force fresh scrape (1 to enable)
          schema:
            type: string
            enum:
              - '0'
              - '1'
          example: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: slug, episode, totalDownloads, downloads[]
        '400':
          description: Invalid or missing parameters
        '404':
          description: Not found
        '500':
          description: Internal server error
  /stream/proxy:
    get:
      tags:
        - Watch
      summary: Stream proxy (alias of /proxy)
      description: Alias of /proxy for players configured with the original AniKotoAPI path.
      operationId: streamProxy
      parameters:
        - name: url
          in: query
          required: true
          description: Target URL
          schema:
            type: string
        - name: referer
          in: query
          required: false
          description: Referer to send
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: string
                    description: Proxied media / rewritten playlist
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /stream/ts-proxy:
    get:
      tags:
        - Watch
      summary: Segment proxy (alias of /proxy)
      description: Alias of /proxy for HLS segments, kept for compatibility with the original AniKotoAPI path.
      operationId: streamTsProxy
      parameters:
        - name: url
          in: query
          required: true
          description: Segment URL
          schema:
            type: string
        - name: referer
          in: query
          required: false
          description: Referer to send
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: string
                    description: Proxied segment
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /health:
    get:
      tags:
        - System
      summary: Health check
      description: 'Liveness probe: status, version, uptime and memory. Never touches the upstream site.'
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: status, version, uptime, memory, node, timestamp
        '500':
          description: Internal server error
  /stats:
    get:
      tags:
        - System
      summary: Server statistics
      description: Request counters, cache usage and feature flags (brotli, mirrors, proxies) for this instance.
      operationId: getStats
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: requests, cache, endpoints, features
        '500':
          description: Internal server error
  /cache/stats:
    get:
      tags:
        - System
      summary: Cache statistics
      description: In-memory cache entry count, hits, misses and hit rate.
      operationId: getCacheStats
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: keys, hits, misses, hitRate
        '500':
          description: Internal server error
  /mirrors:
    get:
      tags:
        - System
      summary: Mirror status
      description: Health, latency and current selection for every configured upstream mirror. Cached for 30 s.
      operationId: getMirrors
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      description: name, url, status, latencyMs, isCurrent
        '500':
          description: Internal server error
  /mirrors/reset:
    post:
      tags:
        - System
      summary: Reset mirror state
      description: 'Clears mirror failure state so the primary mirror is tried first again. Requires `Authorization: Bearer <ADMIN_TOKEN>` when ADMIN_TOKEN is set.'
      operationId: resetMirrors
      parameters: []
      responses:
        '200':
          description: Reset done
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /proxy/status:
    get:
      tags:
        - System
      summary: Outbound proxy status
      description: Proxy pool health (credentials masked) and Cloudflare Worker configuration.
      operationId: getProxyStatus
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: configured, total, healthy, proxies[], cloudflareWorker
        '500':
          description: Internal server error
  /openapi:
    get:
      tags:
        - System
      summary: OpenAPI document
      description: This API's OpenAPI 3.0 description as JSON. Returned as the raw document, not wrapped in { ok, data }.
      operationId: getOpenApi
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
        '500':
          description: Internal server error

components:
  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Anime slug from the URL (e.g. one-piece-odmau)
      example: one-piece-odmau

    refresh:
      name: refresh
      in: query
      required: false
      schema:
        type: string
        enum: ["0", "1"]
      description: Set to `1` to bypass cache and force a fresh scrape
      example: "1"

  schemas:
    # ─── Shared ────────────────────────────────────────────────────
    EpisodeStatus:
      type: object
      properties:
        sub:
          type: integer
          nullable: true
          example: 1080
        dub:
          type: integer
          nullable: true
          example: 1040
        total:
          type: integer
          nullable: true
          example: 1100

    AnimeCard:
      type: object
      properties:
        id:
          type: string
          example: "4127"
        slug:
          type: string
          example: "one-piece-odmau"
        title:
          type: string
          example: "One Piece"
        titleJp:
          type: string
          example: "One Piece"
        image:
          type: string
          format: uri
          example: "https://cdn.anipixcdn.co/thumbnail/a1ea8c4b315b25f06e3c212423037951.jpg"
        href:
          type: string
          example: "/api/anime/one-piece-odmau"
        type:
          type: string
          example: "TV"
        episodes:
          $ref: '#/components/schemas/EpisodeStatus'
        date:
          type: string
          example: "1999"
        score:
          type: number
          example: 8.9
        totalEpisodes:
          type: integer
          example: 1100

    LatestEpisodeItem:
      type: object
      properties:
        id:
          type: string
          example: "4127"
        slug:
          type: string
          example: "one-piece-odmau"
        title:
          type: string
          example: "One Piece"
        titleJp:
          type: string
          example: "One Piece"
        image:
          type: string
          format: uri
        href:
          type: string
          example: "/api/anime/one-piece-odmau"
        watchHref:
          type: string
          example: "https://anikoto.net/watch/one-piece-odmau/ep-1100"
        type:
          type: string
          example: "TV"
        episodes:
          $ref: '#/components/schemas/EpisodeStatus'

    TopTableItem:
      type: object
      properties:
        id:
          type: string
          example: "4127"
        slug:
          type: string
          example: "one-piece-odmau"
        title:
          type: string
          example: "One Piece"
        titleJp:
          type: string
        image:
          type: string
          format: uri
        href:
          type: string
          example: "/api/anime/one-piece-odmau"
        type:
          type: string
          example: "TV"
        episodes:
          $ref: '#/components/schemas/EpisodeStatus'
        date:
