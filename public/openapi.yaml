openapi: 3.0.3
info:
  title: Anikoto Scraper API
  description: |
    A high-performance REST API for scraping anime data from **anikoto.net** — built with Next.js, Cheerio, and in-memory caching.

    ## Response Format
    All endpoints return a consistent JSON envelope:
    ```json
    { "ok": true, "data": { ... }, "cached": true }
    ```
    On error:
    ```json
    { "ok": false, "message": "Error description" }
    ```

    ## Caching
    | Endpoint | TTL |
    |----------|-----|
    | `/api/home` | 5 minutes |
    | `/api/anime/:slug` | 30 minutes |
    | `/api/anime/tooltip/:id` | 30 minutes |
    | `/api/search` | 2 minutes |
    | `/api/filter` | 5 minutes |
    | `/api/schedule` | 1 hour |
    | `/api/watch/:slug` (Episodes) | 10 minutes |

    Add `?refresh=1` to any cached endpoint to bypass the cache.
  version: "1.0.0"
  contact:
    name: Teramoto

servers:
  - url: https://anikoto-scrap-api.vercel.app/api
    description: Production server
  - url: /api
    description: Local development server

tags:
  - name: Home
    description: Homepage and widget data
  - name: Anime
    description: Anime detail, episodes, recommendations, related, and tooltip
  - name: Browse
    description: Browse, filter, search, widgets, and listings
  - name: Schedule
    description: Weekly airing schedule
  - name: Watch
    description: Streaming sources, SSE streaming, and proxy

paths:
  /home:
    get:
      tags: [Home]
      summary: Homepage data
      description: >
        Returns spotlight carousel, latest episodes, new release, and top anime by day / week / month.
        Optionally returns dynamic widget data if `widget` parameter is provided.
      operationId: getHome
      parameters:
        - name: widget
          in: query
          required: false
          schema:
            type: string
            enum: [updated-all, updated-sub, updated-dub, trending, random]
          description: Optional widget name to fetch widget data instead of full home data
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for widget data
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/HomeData'
                      - $ref: '#/components/schemas/HomeWidgetResult'
              example:
                ok: true
                cached: false
                data:
                  spotlight: []
                  latestEpisodes: []
                  newRelease: []
                  newAdded: []
                  justCompleted: []
                  topDay: []
                  topWeek: []
                  topMonth: []
        '500':
          $ref: '#/components/responses/Error'

  /search:
    get:
      tags: [Browse]
      summary: Search anime by keyword
      description: Search anime by keyword. Returns paginated list of matching anime cards.
      operationId: searchAnime
      parameters:
        - name: keyword
          in: query
          required: true
          description: Search keyword
          schema:
            type: string
            example: one piece
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SearchResult'
              example:
                ok: true
                cached: false
                data:
                  keyword: one piece
                  totalResults: 42
                  currentPage: 1
                  hasNextPage: true
                  hasPreviousPage: false
                  minPage: 1
                  maxPage: 3
                  results: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /filter:
    get:
      tags: [Browse]
      summary: Advanced anime filter
      description: Filter anime with multiple combinable parameters (genres, seasons, years, media types, airing status, languages, ratings, and sort order).
      operationId: filterAnime
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Search keyword
          example: demon slayer
        - name: genre[]
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
          description: "Genre ID or slug (e.g. 1, action, romance)"
        - name: season[]
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [spring, summer, fall, winter]
          description: Season filter
        - name: year[]
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
          description: Year filter (e.g. 2026, 2025)
        - name: term_type[]
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [Movie, Music, ONA, OVA, Special, TV]
          description: Media type filter
        - name: status[]
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [currently-airing, finished-airing, not-yet-aired]
          description: Airing status filter
        - name: language[]
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [sub, dub]
          description: Language filter
        - name: rating[]
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [G, PG, PG-13, R, R+, Rx]
          description: Age rating filter
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - default
              - latest-updated
              - latest-added
              - score
              - name-az
              - release-date
              - most-viewed
              - number_of_episodes
            default: default
          description: Sort order
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Filtered results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FilterResult'
        '500':
          $ref: '#/components/responses/Error'

  /anime/{slug}:
    get:
      tags: [Anime]
      summary: Anime detail
      description: >
        Get full anime info including title, synopsis, genres, studios, MAL score, episode count, and status.
        Optionally filters the embedded episode list by range using `start` and `end` query parameters.
      operationId: getAnimeDetail
      parameters:
        - $ref: '#/components/parameters/slug'
        - name: start
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Starting episode number to include (inclusive). Must be used together with `end`.
          example: 1
        - name: end
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Ending episode number to include (inclusive). Must be used together with `start`.
          example: 12
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Anime detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AnimeDetail'
              example:
                ok: true
                cached: true
                data:
                  id: one-piece-odmau
                  slug: one-piece-odmau
                  title: One Piece
                  type: TV
                  status: Currently Airing
                  malScore: 8.9
                  genres: [Action, Adventure, Comedy]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /anime/{slug}/episodes:
    get:
      tags: [Anime]
      summary: Anime episode list
      description: Get all episodes for a given anime slug, optionally filtered by episode range.
      operationId: getAnimeEpisodes
      parameters:
        - $ref: '#/components/parameters/slug'
        - name: start
          in: query
          required: false
          schema:
            type: string
          description: Starting episode number (inclusive)
          example: "5"
        - name: end
          in: query
          required: false
          schema:
            type: string
          description: Ending episode number (inclusive)
          example: "10"
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Episode list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AnimeEpisodes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /anime/{slug}/related:
    get:
      tags: [Anime]
      summary: Related anime listing
      description: Returns related anime (watch order/sequels/prequels/etc.) for a given anime slug.
      operationId: getAnimeRelated
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Related anime list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RelatedAnime'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /anime/{slug}/recommendations:
    get:
      tags: [Anime]
      summary: Anime recommendations listing
      description: Returns recommended anime cards for a given anime slug.
      operationId: getAnimeRecommendations
      parameters:
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Recommendations listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnimeCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /anime/tooltip/{id}:
    get:
      tags: [Anime]
      summary: Get anime tooltip preview info by ID
      description: Fetches and parses the preview/tooltip HTML containing title, synopsis, year, scores, genres, and metadata for a given anime ID (`data-tip` attribute).
      operationId: getAnimeTooltip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Anime ID from the `data-tip` attribute of an anime poster
          example: "4127"
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Anime tooltip info
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AnimeTooltip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /updated:
    get:
      tags: [Browse]
      summary: Latest updated anime listing
      description: Paginated listing of anime scraped directly from https://anikoto.net/latest-updated.
      operationId: getUpdated
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Listing results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ListingResult'
        '500':
          $ref: '#/components/responses/Error'

  /widget:
    get:
      tags: [Browse]
      summary: Home widgets data
      description: "Fetch dynamic home widgets: updated-all (default), updated-sub, updated-dub, trending, random."
      operationId: getWidgetData
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            default: updated-all
            enum:
              - updated-all
              - updated-sub
              - updated-dub
              - trending
              - random
          description: "Widget name (default: updated-all)"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Widget data results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/HomeWidgetResult'
        '500':
          $ref: '#/components/responses/Error'

  /status:
    get:
      tags: [Browse]
      summary: Browse anime by airing status
      description: Browse anime filtered by airing status (`currently-airing`, `finished-airing`, `not-yet-aired`).
      operationId: getByStatus
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [currently-airing, finished-airing, not-yet-aired]
            default: currently-airing
          description: Airing status
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Status listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ListingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /genre/{genre}:
    get:
      tags: [Browse]
      summary: Browse anime by genre
      description: Browse anime filtered by genre slug (e.g. action, romance, isekai, fantasy).
      operationId: getByGenre
      parameters:
        - name: genre
          in: path
          required: true
          schema:
            type: string
          description: Genre slug (e.g. action, romance, isekai, fantasy)
          example: action
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Genre listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GenreListingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /type/{type}:
    get:
      tags: [Browse]
      summary: Browse anime by media type
      description: Browse anime filtered by media type (`tv`, `movie`, `ova`, `ona`, `special`, `music`).
      operationId: getByType
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [tv, movie, ova, ona, special, music]
          description: Media type
          example: movie
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Type listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TypeListingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /schedule:
    get:
      tags: [Schedule]
      summary: Weekly airing schedule
      description: >
        Get the 7-day weekly airing schedule starting from today (UTC).
        Each day is fetched in parallel via the site's `/ajax/schedule/date` endpoint.
        
        AnimeCard fields repurposed for schedule items:
        - `date`: Airing time in the requested timezone (e.g. `"21:00"`)
        - `type`: Episode label (e.g. `"Episode 13"`)
        - `image`: Resolved poster image URL (requires `images=true`)
      operationId: getSchedule
      parameters:
        - name: tz
          in: query
          required: false
          schema:
            type: integer
            minimum: -12
            maximum: 14
            default: 0
          description: UTC offset in hours (e.g. 7 for UTC+7, -5 for UTC-5). Affects the airing times in the `date` field.
          example: 7
        - name: images
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Set to true to resolve and fetch poster images (defaults to false)
          example: true
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: 7-day schedule grouped by day
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleDay'
        '500':
          $ref: '#/components/responses/Error'

  /watch/{slug}:
    get:
      tags: [Watch]
      summary: Streaming sources for an episode
      description: >
        Retrieves video servers and stream sources for a specific episode.
        
        **Dual Streaming & JSON Modes**:
        - Default mode (or cold cache miss): Returns an SSE stream (`text/event-stream`) delivering chunks progressively (`episode`, `servers`, `source` x N, `done`).
        - `stream=false` or cache hit: Returns a standard single JSON object containing full `WatchData`.
      operationId: watchEpisode
      parameters:
        - $ref: '#/components/parameters/slug'
        - name: ep
          in: query
          required: true
          schema:
            type: string
          description: Episode number to watch
          example: "1"
        - name: stream
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Set to `false` to disable SSE streaming and wait for the complete JSON response
          example: true
        - $ref: '#/components/parameters/refresh'
      responses:
        '200':
          description: Streaming sources response (JSON on cache hit or stream=false, SSE chunks when streaming)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  cached:
                    type: boolean
                  streaming:
                    type: boolean
                    example: false
                  data:
                    $ref: '#/components/schemas/WatchData'
            text/event-stream:
              schema:
                type: string
                description: >
                  Progressive SSE events:
                  - `data: {"type":"episode","episode":{...}}`
                  - `data: {"type":"servers","servers":[...]}`
                  - `data: {"type":"source","source":{...}}`
                  - `data: {"type":"done"}`
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'

  /proxy:
    get:
      tags: [Watch]
      summary: Streaming proxy
      description: >
        High-volume zero-copy streaming proxy to bypass Cloudflare and CORS restrictions for m3u8 video streams, WebVTT subtitle files, and media segments.
        Features multi-node proxy pool routing, anti-bot browser header rotation, SSRF guard, and automatic failover retries.
        Rewrites segment URLs within m3u8 playlists to keep them routed through the proxy.
      operationId: proxyStream
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: The target m3u8 or subtitle URL to proxy
          example: "https://cdn.mewstream.buzz/.../master.m3u8"
        - name: referer
          in: query
          required: false
          schema:
            type: string
            format: uri
          description: Referer header to bypass hotlink protection
          example: "https://megaplay.buzz/"
        - name: proxy
          in: query
          required: false
          schema:
            type: string
          description: Optional custom proxy node URL (http/https/socks) for outbound routing
          example: "http://user:pass@proxy.example.com:8080"
      responses:
        '200':
          description: Proxied stream data
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                description: m3u8 playlist with rewritten segment URLs
            text/vtt:
              schema:
                type: string
                description: WebVTT subtitle track
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Binary video/audio segment stream
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Access denied (SSRF guard blocked target local/private IP)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Forbidden: Access to private or local network addresses is restricted"
        '500':
          $ref: '#/components/responses/Error'
        '502':
          description: Bad Gateway (Upstream proxy failed after retries)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Proxy failed after 3 attempts"
                  detail:
                    type: string
                  url:
                    type: string

components:
  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Anime slug from the URL (e.g. one-piece-odmau)
      example: one-piece-odmau

    refresh:
      name: refresh
      in: query
      required: false
      schema:
        type: string
        enum: ["0", "1"]
      description: Set to `1` to bypass cache and force a fresh scrape
      example: "1"

  schemas:
    # ─── Shared ────────────────────────────────────────────────────
    EpisodeStatus:
      type: object
      properties:
        sub:
          type: integer
          nullable: true
          example: 1080
        dub:
          type: integer
          nullable: true
          example: 1040
        total:
          type: integer
          nullable: true
          example: 1100

    AnimeCard:
      type: object
      properties:
        id:
          type: string
          example: "4127"
        slug:
          type: string
          example: "one-piece-odmau"
        title:
          type: string
          example: "One Piece"
        titleJp:
          type: string
          example: "One Piece"
        image:
          type: string
          format: uri
          example: "https://cdn.anipixcdn.co/thumbnail/a1ea8c4b315b25f06e3c212423037951.jpg"
        href:
          type: string
          example: "/api/anime/one-piece-odmau"
        type:
          type: string
          example: "TV"
        episodes:
          $ref: '#/components/schemas/EpisodeStatus'
        date:
          type: string
          example: "1999"
        score:
          type: number
          example: 8.9
        totalEpisodes:
          type: integer
          example: 1100

    LatestEpisodeItem:
      type: object
      properties:
        id:
          type: string
          example: "4127"
        slug:
          type: string
          example: "one-piece-odmau"
        title:
          type: string
          example: "One Piece"
        titleJp:
          type: string
          example: "One Piece"
        image:
          type: string
          format: uri
        href:
          type: string
          example: "/api/anime/one-piece-odmau"
        watchHref:
          type: string
          example: "https://anikoto.net/watch/one-piece-odmau/ep-1100"
