      allOf:
        - $ref: '#/components/schemas/ListingResult'
        - type: object
          properties:
            genre:
              type: string
              example: "action"

    TypeListingResult:
      allOf:
        - $ref: '#/components/schemas/ListingResult'
        - type: object
          properties:
            mediaType:
              type: string
              example: "movie"

    HomeWidgetResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/LatestEpisodeItem'
        currentPage:
          type: integer
          example: 1
        hasNextPage:
          type: boolean
          example: true
        hasPreviousPage:
          type: boolean
          example: false
        maxPage:
          type: integer
          example: 2

    # ─── Schedule ──────────────────────────────────────────────────
    ScheduleDay:
      type: object
      properties:
        day:
          type: string
          description: Human-readable day label (e.g. "Sat Jul 04")
          example: "Sat Jul 04"
        animes:
          type: array
          description: Anime airing on this day
          items:
            $ref: '#/components/schemas/AnimeCard'

    # ─── Watch ─────────────────────────────────────────────────────
    IntroOutro:
      type: object
      properties:
        start:
          type: integer
          example: 111
        end:
          type: integer
          example: 199

    VideoServer:
      type: object
      properties:
        id:
          type: string
          example: "131818-vidplay"
        name:
          type: string
          example: "VidPlay-1"
        type:
          type: string
          example: "sub"
        svId:
          type: string
          example: "8e4"

    VideoTrack:
      type: object
      properties:
        file:
          type: string
          format: uri
          example: "https://megaplay.buzz/sub/..."
        label:
          type: string
          example: "English"
        kind:
          type: string
          example: "captions"
        default:
          type: boolean
          example: true
        proxyUrl:
          type: string
          example: "/api/proxy?url=..."

    VideoSource:
      type: object
      properties:
        server:
          type: string
          example: "Vidstream-2"
        type:
          type: string
          example: "sub"
        url:
          type: string
          format: uri
          example: "https://megaplay.buzz/stream/..."
        m3u8:
          type: string
          format: uri
          nullable: true
          example: "https://cdn.mewstream.buzz/.../master.m3u8"
        referer:
          type: string
          format: uri
          example: "https://megaplay.buzz/"
        proxyUrl:
          type: string
          format: uri
          nullable: true
          example: "/api/proxy?url=..."
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/VideoTrack'
        skip_data:
          type: object
          nullable: true
          properties:
            intro:
              $ref: '#/components/schemas/IntroOutro'
            outro:
              $ref: '#/components/schemas/IntroOutro'

    WatchData:
      type: object
      properties:
        episode:
          $ref: '#/components/schemas/Episode'
        servers:
          type: array
          items:
            $ref: '#/components/schemas/VideoServer'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/VideoSource'

    # ─── API Error ─────────────────────────────────────────────────
    ApiError:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          example: false
        message:
          type: string
          example: "Internal server error"

  responses:
    Error:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            ok: false
            message: Failed to fetch data from source

    BadRequest:
      description: Bad request — missing or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            ok: false
            message: Missing required parameter

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            ok: false
            message: Anime not found
